<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="0.55" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ede9fe"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#1e1b4b" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#tile)"/>
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#glow)"/>

  <!-- the bubble popping up: rounded body with a tail at the bottom left -->
  <path filter="url(#lift)" fill="url(#bubble)"
        d="M78 62 H172 A34 34 0 0 1 206 96 V140 A34 34 0 0 1 172 174 H116
           L82 202 Q74 208 75 198 L78 174 A34 34 0 0 1 44 140 V96 A34 34 0 0 1 78 62 Z"/>

  <!-- the answer coming: typing dots, growing -->
  <circle cx="90" cy="118" r="11" fill="#7c3aed" opacity="0.55"/>
  <circle cx="125" cy="118" r="13" fill="#7c3aed" opacity="0.8"/>
  <circle cx="162" cy="118" r="15" fill="#6d28d9"/>

  <!-- pop: a burst at the corner -->
  <g stroke="#fde68a" stroke-width="9" stroke-linecap="round">
    <line x1="206" y1="54" x2="218" y2="38"/>
    <line x1="220" y1="72" x2="238" y2="66"/>
    <line x1="190" y1="44" x2="190" y2="26"/>
  </g>
</svg>
