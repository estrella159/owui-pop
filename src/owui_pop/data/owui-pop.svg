<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a42"/>
      <stop offset="1" stop-color="#1c1c21"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-40%" width="140%" height="200%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- graphite tile with a soft top edge -->
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#tile)"/>
  <rect x="9" y="9" width="238" height="238" rx="57" fill="none" stroke="url(#edge)" stroke-width="2"/>

  <!-- the ask bar popping up -->
  <rect filter="url(#lift)" x="40" y="104" width="176" height="56" rx="18" fill="#f4f4f5"/>
  <!-- the text cursor waiting for a question -->
  <rect x="62" y="118" width="7" height="28" rx="3.5" fill="#7c3aed"/>
  <!-- placeholder text, faint -->
  <rect x="82" y="128" width="70" height="8" rx="4" fill="#a1a1aa" opacity="0.6"/>

  <!-- pop: one small spark above the bar -->
  <path fill="#c4b5fd"
        d="M190 52 C192 66 196 70 210 72 C196 74 192 78 190 92 C188 78 184 74 170 72 C184 70 188 66 190 52 Z"/>
</svg>
